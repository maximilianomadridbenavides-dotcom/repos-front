sonar.projectKey=maximilianomadridbenavides-dotcom_repos-front
sonar.organization=maximilianomadridbenavides-dotcom
sonar.projectName=repos-front
sonar.sources=.
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
